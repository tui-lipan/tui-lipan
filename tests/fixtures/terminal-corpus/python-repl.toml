command: scripts/capture-terminal-corpus python-repl
tool: python pty capture (3.14.8), winsize 24x80
program: Python 3.14.8
child: /usr/bin/python3 -i
TERM=xterm-256color COLORTERM=truecolor LANG=C.UTF-8
HOME is the capture home, so the REPL does not read a user startup file.
"""

