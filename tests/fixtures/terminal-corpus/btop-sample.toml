description = "btop in tty mode for about two seconds, inside a fresh pid namespace."
source = """
command: scripts/capture-terminal-corpus btop-sample
tool: python pty capture (3.14.8), winsize 24x80
program: btop version: \u001B[1m1.4.7\u001B[0m; unshare from util-linux 2.42.4
child: unshare --user --map-root-user --pid --fork --mount-proc -- btop -t -u 1000
TERM=xterm-256color COLORTERM=truecolor LANG=C.UTF-8
The pid namespace hides host processes. CPU model and memory total are replaced with same-width placeholders. The clock and per-core totals are live, so a re-record differs.
"""
