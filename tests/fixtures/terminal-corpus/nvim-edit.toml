rows = 24
cols = 80
scrollback = 10000
description = "nvim --clean opens a file, pages down, inserts text, and quits the alternate screen."
source = """
command: scripts/capture-terminal-corpus nvim-edit
tool: python pty capture (3.14.8), winsize 24x80
program: NVIM v0.12.6
child: nvim --clean -c "syntax enable|setfiletype rust|set noswapfile noundofile nomore shortmess+=I nowrap" sample.rs
TERM=xterm-256color COLORTERM=truecolor LANG=C.UTF-8
No user config, shada, or swap files. Syntax uses the system runtime.
"""

[[differences]]
path = "/dumps/0/responses"
reason = "Ghostty answers more of neovim's probes: DECRQM reports modes 69, 2027 and 2031 as recognized and reset (Alacritty: not recognized), it answers DECRQSS for SGR and XTGETTCAP. Mode 2048 is reported as unsupported by both engines because hosts deliver replies on child output, not on resize."
