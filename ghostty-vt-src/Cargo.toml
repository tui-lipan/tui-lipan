[package]
name = "tui-lipan-ghostty-vt-src"
# The build metadata names the vendored libghostty-vt release. crates.io ignores it when
# comparing versions, so every new tree (an upstream bump or a patch change) bumps the numeric
# part, and tui-lipan-ghostty-vt-sys pins that with `=`.
version = "0.1.0+libghostty-vt.1.0.1"
edition = "2024"
rust-version = "1.96"
# Everything vendored: libghostty-vt (MIT), simdutf and wuffs (Apache-2.0 OR MIT), Highway
# (Apache-2.0 OR BSD-3-Clause), uucode, aro (MIT AND Unicode-3.0) and translate_c (MIT).
# THIRD_PARTY.md lists each package with its licence files.
license = "MIT AND (Apache-2.0 OR MIT) AND (Apache-2.0 OR BSD-3-Clause) AND Unicode-3.0"
description = "Vendored libghostty-vt 1.0.1 source and Zig dependencies, with tui-lipan's patches applied, for tui-lipan-ghostty-vt-sys."
repository = "https://github.com/tui-lipan/tui-lipan"
authors = ["Adam Mikołajczyk <adam@tui-lipan.dev>"]
readme = "README.md"
keywords = ["ghostty", "terminal", "vt", "vendored"]
categories = ["external-ffi-bindings"]
# The vendored trees are generated by scripts/package-ghostty-src.sh and gitignored. An explicit
# include list also makes `cargo package` take them in spite of that.
include = [
  "/Cargo.toml",
  "/README.md",
  "/PATCHES",
  "/THIRD_PARTY.md",
  "/src/**",
  "/libghostty-vt/**",
  "/libghostty-vt-deps/**",
]

[dependencies]
