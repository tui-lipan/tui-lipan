[package]
name = "tui-lipan-ghostty-vt-sys"
version = "0.3.1"
edition = "2024"
rust-version = "1.96"
# The library is MIT; these bindings follow the rest of the workspace.
license = "MPL-2.0"
description = "Raw FFI bindings to libghostty-vt 1.x for tui-lipan, built with Zig from the pinned, patched upstream release."
repository = "https://github.com/tui-lipan/tui-lipan"
authors = ["Adam Mikołajczyk <adam@tui-lipan.dev>"]
links = "ghostty-vt"
build = "build.rs"
keywords = ["ghostty", "terminal", "vt", "ffi"]
categories = ["external-ffi-bindings", "command-line-interface"]

[dependencies]

[build-dependencies]
pkg-config = "0.3.32"
sha2 = "0.11.1"
# The patched release source this crate builds by default. Pinned exactly: the bindings, the
# patches below and the vendored tree must all describe the same library.
tui-lipan-ghostty-vt-src = "=0.2.0"

[dev-dependencies]
sha2 = "0.11.1"

[[test]]
name = "build_cache"
path = "build/cache_tests.rs"
