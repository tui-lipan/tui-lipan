name: libghostty-vt source

# tui-lipan-ghostty-vt-src is generated by scripts/package-ghostty-src.sh, never committed. This
# checks that the crate on crates.io is exactly what the script makes from the pinned release and
# the committed patches, and that a new, unpublished version still builds and fits.
on:
  pull_request:
    paths:
      - ghostty-vt-src/**
      - ghostty-vt-sys/Cargo.toml
      - ghostty-vt-sys/patches/**
      - scripts/package-ghostty-src.sh
      - .github/workflows/ghostty-src.yml
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghostty-src-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  vendored-source:
    name: Vendored source
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Ghostty signs its release tarballs; the script then checks them, not only their sums.
      - name: Install minisign
        run: sudo apt-get update && sudo apt-get install -y minisign

      - name: Find the -src version and whether it is published
        id: src
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' ghostty-vt-src/Cargo.toml | head -n 1)"
          numeric="${version%%+*}"
          grep -Fq "tui-lipan-ghostty-vt-src = \"=$numeric\"" ghostty-vt-sys/Cargo.toml || {
            echo "::error::ghostty-vt-sys/Cargo.toml must pin tui-lipan-ghostty-vt-src = \"=$numeric\""
            exit 1
          }
          status="$(curl -s -o /dev/null -w '%{http_code}' -A 'tui-lipan CI (github.com/tui-lipan/tui-lipan)' \
            "https://crates.io/api/v1/crates/tui-lipan-ghostty-vt-src/$version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "published=$([[ "$status" == 200 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "tui-lipan-ghostty-vt-src $version: crates.io answered $status"

      # A published version must be reproducible exactly. A patch change without a version bump
      # fails here, because crates.io cannot take a second upload of the same version.
      - name: Compare with the published crate
        if: steps.src.outputs.published == 'true'
        env:
          REQUIRE_MINISIGN: "1"
        run: ./scripts/package-ghostty-src.sh --no-smoke --check-crate "${{ steps.src.outputs.version }}"

      - name: Install Zig 0.17.1
        if: steps.src.outputs.published != 'true'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.1
          use-cache: false

      # A new version: generate it, build it offline with Zig, and check the size cap.
      - name: Generate and smoke-build the unpublished version
        if: steps.src.outputs.published != 'true'
        env:
          REQUIRE_MINISIGN: "1"
        run: ./scripts/package-ghostty-src.sh
