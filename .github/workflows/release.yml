name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release-notes:
    name: Generate release notes
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      contents: read

    steps:
      - name: Check out repository history
        uses: actions/checkout@v7
        with:
          # The prepare script compares this tag with the previous published release.
          fetch-depth: 0
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install pinned OpenCode CLI
        run: npm install --global opencode-ai@1.18.31

      - name: Prepare exact release range
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release_notes.py prepare \
            --repository "$GITHUB_REPOSITORY" \
            --to-tag "$GITHUB_REF_NAME" \
            --expected-to-sha "$GITHUB_SHA" \
            --input release-notes-input.md \
            --metadata release-notes-range.json

      # OpenCode receives no GitHub or publication token. Its dedicated config permits reading
      # release-notes-input.md and writing release-notes.md; every other operation is denied.
      - name: Write user-facing notes
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          OPENCODE_CONFIG: ${{ github.workspace }}/.opencode/release-notes.json
          OPENCODE_DISABLE_AUTOUPDATE: "true"
        run: |
          set -euo pipefail
          test -n "$GOOGLE_GENERATIVE_AI_API_KEY"
          opencode run --variant low --command changelog
          test -s release-notes.md

      - name: Validate and freeze generated Markdown
        run: |
          python3 scripts/release_notes.py validate \
            --input release-notes.md \
            --output release-notes.md

      - name: Upload immutable release-note input and result
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: |
            release-notes.md
            release-notes-input.md
            release-notes-range.json
          if-no-files-found: error
          overwrite: false
          retention-days: 14

  verify:
    name: Verify release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check tag matches crate versions
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "Tag is not a stable semantic version: $GITHUB_REF_NAME"; exit 1; }
          grep -Fqx "version = \"$VERSION\"" <(grep '^version = ' Cargo.toml) \
            || { echo "Cargo.toml version does not match tag $GITHUB_REF_NAME"; exit 1; }
          grep -Fqx "version = \"$VERSION\"" \
            <(grep '^version = ' tui-lipan-macro/Cargo.toml) \
            || { echo "tui-lipan-macro/Cargo.toml version does not match tag $GITHUB_REF_NAME"; exit 1; }
          grep -Fq "version = \"$VERSION\"" <(grep 'tui-lipan-macro = ' Cargo.toml) \
            || { echo "tui-lipan-macro dependency version in Cargo.toml does not match tag"; exit 1; }

      - name: Test release-note range and format policy
        run: python3 -m unittest scripts.test_release_notes

      - name: Run cargo tests
        run: cargo test --workspace --all-features

  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: [verify, release-notes]
    environment: release
    permissions:
      contents: read
      # Required for crates.io Trusted Publishing (OIDC).
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Authenticate with crates.io (Trusted Publishing)
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish tui-lipan-macro
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          STATUS=$(curl --silent --show-error --retry 3 --connect-timeout 10 --max-time 30 \
            --user-agent "tui-lipan-release-workflow (https://github.com/tui-lipan/tui-lipan)" \
            --output /dev/null --write-out '%{http_code}' \
            "https://crates.io/api/v1/crates/tui-lipan-macro/$VERSION")
          case "$STATUS" in
            200) echo "tui-lipan-macro $VERSION is already published" ;;
            404) cargo publish -p tui-lipan-macro ;;
            *) echo "crates.io returned HTTP $STATUS for tui-lipan-macro $VERSION"; exit 1 ;;
          esac
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Wait for tui-lipan-macro in the crates.io index
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --retry 3 --connect-timeout 10 --max-time 30 \
              --user-agent "tui-lipan-release-workflow (https://github.com/tui-lipan/tui-lipan)" \
              "https://index.crates.io/tu/i-/tui-lipan-macro" \
              | grep --fixed-strings "\"vers\":\"$VERSION\"" >/dev/null; then
              exit 0
            fi
            echo "Waiting for tui-lipan-macro $VERSION (attempt $attempt/30)"
            sleep 10
          done
          echo "tui-lipan-macro $VERSION did not appear in the crates.io index"
          exit 1

      - name: Publish tui-lipan
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          STATUS=$(curl --silent --show-error --retry 3 --connect-timeout 10 --max-time 30 \
            --user-agent "tui-lipan-release-workflow (https://github.com/tui-lipan/tui-lipan)" \
            --output /dev/null --write-out '%{http_code}' \
            "https://crates.io/api/v1/crates/tui-lipan/$VERSION")
          case "$STATUS" in
            200) echo "tui-lipan $VERSION is already published" ;;
            404) cargo publish -p tui-lipan ;;
            *) echo "crates.io returned HTTP $STATUS for tui-lipan $VERSION"; exit 1 ;;
          esac
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      # Required to create the release.
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download generated release notes
        uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: release-notes

      - name: Create GitHub Release
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --title "tui-lipan $GITHUB_REF_NAME" \
              --notes-file release-notes/release-notes.md \
              --latest
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "tui-lipan $GITHUB_REF_NAME" \
              --notes-file release-notes/release-notes.md \
              --latest \
              --verify-tag
          fi
        env:
          GH_TOKEN: ${{ github.token }}
